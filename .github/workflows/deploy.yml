name: Auto Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/shopee-repair-system
            git fetch origin main
            git reset --hard origin/main
            npm install
            cd server && npm install && cd ..
            cd client && npm install && npm run build && cd ..
            pm2 startOrReload ecosystem.config.js --env production || pm2 restart shopee-repair-api || pm2 start server/src/index.js --name shopee-repair-api
            pm2 save
            echo "✅ Auto deploy VPS sukses dijalankan!"
