name: Auto Deploy to DomaiNesia VPS

on:
  push:
    branches:
      - main # Ubah ke 'master' jika default branch repo Anda adalah master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/shopee-repair-system
            git pull origin main # Sesuaikan jika branch master
            npm install
            npm run build
            pm2 restart shopee-repair-api
            echo "✅ Auto deploy sukses dijalankan!"
